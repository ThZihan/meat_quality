; PlatformIO Project Configuration File for MQ135 + MQ136 + MQ137 Combined Sensors
; ESP32 NodeMCU - Meat Quality Air Data Project (HTTP API Version)
;
; This version connects to WiFi and sends sensor data to cloud server via HTTP POST
; Compatible with meat-monitor.kalobiral.com.bd API server

[env:esp32dev]
platform = espressif32@6.7.0
board = nodemcu-32s
framework = arduino

; Serial monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload settings (adjust COM port as needed)
upload_port = /dev/ttyUSB0
upload_speed = 115200

; Build flags
build_flags =
	-D CORE_DEBUG_LEVEL=3
	-D LINKER_FLAGS="-Wl,--no-warn-mismatch"

; Library dependencies for WiFi, HTTP, and JSON
lib_deps =
	; WiFi and HTTPClient are included in ESP32 Arduino framework
	; JSON library for data serialization
	bblanchon/ArduinoJson @ ^6.21.0
	; AHT10 temperature/humidity sensor (I2C)
	adafruit/Adafruit AHTX0 @ ^2.0.4
	adafruit/Adafruit BusIO @ ^1.14.5
