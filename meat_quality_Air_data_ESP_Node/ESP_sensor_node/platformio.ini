; PlatformIO Project Configuration — MQ135 + MQ136 + MQ137 + BME280
; ESP32 NodeMCU — Meat Quality Air Data Node (BLE-only version)
;
; This build has no WiFi, no HTTP and no NTP. The node is a BLE peripheral and
; the Raspberry Pi ~10 inches away is the only consumer of its data; the Pi owns
; the uplink to meat-monitor.kalobiral.com.bd.
;
; NimBLE is used instead of the bundled Bluedroid stack: it is dramatically
; smaller in both flash and RAM, which leaves room for the persistent reading
; queue that guarantees nothing is lost while the Pi is unreachable.

[env:esp32dev]
platform = espressif32@6.7.0
board = nodemcu-32s
framework = arduino


; Serial monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload settings (adjust port as needed)
upload_port = /dev/ttyUSB0
upload_speed = 115200

build_flags =
	-D CORE_DEBUG_LEVEL=0
	-D LINKER_FLAGS="-Wl,--no-warn-mismatch"
	; NimBLE only ever talks to the Pi: one connection, peripheral role only.
	; Trimming the unused roles reclaims a few KB of RAM.
	-D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
	-D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
	-D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

lib_deps =
	; JSON serialization for the BLE payloads
	bblanchon/ArduinoJson @ ^6.21.0
	; BME280 temperature/humidity/pressure (I2C)
	adafruit/Adafruit BME280 Library @ ^2.2.4
	adafruit/Adafruit BusIO @ ^1.14.5
	; BLE peripheral stack (2.x API: NimBLEConnInfo-based callbacks)
	h2zero/NimBLE-Arduino @ ^2.2.3
